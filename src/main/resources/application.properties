# --- Configuracion del DataSource (Soporta Local y Railway dinamicamente) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/onboarding_banco?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway (gestionado manualmente via FlywayConfig)
spring.flyway.enabled=false
spring.flyway.ignore-future-migrations=true
spring.flyway.ignore-pending-migrations=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# GestoPago - Autenticacion
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
# Intervalo de renovacion del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

# GestoPago - Consulta de productos (GET /sistema/service/getProductList.do)
gestopago.products.url=https://gestopago.portalventas.net
# El token NO se versiona: se inyecta por variable de entorno GESTOPAGO_PRODUCTS_TOKEN
gestopago.products.bearer-token=${GESTOPAGO_PRODUCTS_TOKEN:}
gestopago.products.connect-timeout-ms=5000
gestopago.products.read-timeout-ms=10000
# Timeouts del cliente Feign "gestoPagoProducts" (toman los valores de arriba)
spring.cloud.openfeign.client.config.gestoPagoProducts.connect-timeout=${gestopago.products.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProducts.read-timeout=${gestopago.products.read-timeout-ms}

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG

# Informacion general del API y Puertos adaptables para Railway
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=${PORT:8081}

# URLs base del servidor dinámicas
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server