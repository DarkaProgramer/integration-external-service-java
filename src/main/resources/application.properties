# --- Configuracion del DataSource (Soporta Local y Railway dinamicamente) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/onboarding_banco?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway (gestionado manualmente via FlywayConfig)
spring.flyway.enabled=false
spring.flyway.ignore-future-migrations=true
spring.flyway.ignore-pending-migrations=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# GestoPago - Autenticacion
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
# La contrasena NO se versiona: variable de entorno GESTOPAGO_PASSWORD
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
# Intervalo de renovacion del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

# GestoPago - Consulta de productos (GET /sistema/service/getProductList.do)
gestopago.products.url=https://gestopago.portalventas.net
# El token NO se versiona: se inyecta por variable de entorno GESTOPAGO_PRODUCTS_TOKEN
gestopago.products.bearer-token=${GESTOPAGO_PRODUCTS_TOKEN:}
gestopago.products.connect-timeout-ms=5000
gestopago.products.read-timeout-ms=10000
# Timeouts del cliente Feign "gestoPagoProducts" (toman los valores de arriba)
spring.cloud.openfeign.client.config.gestoPagoProducts.connect-timeout=${gestopago.products.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProducts.read-timeout=${gestopago.products.read-timeout-ms}

# GestoPago - Transacciones (POST /sistema/service/sendTx.do)
gestopago.tx.url=https://gestopago.portalventas.net
# Token Bearer por variable de entorno (GESTOPAGO_TX_TOKEN; si no existe, se usa el mismo de productos)
gestopago.tx.bearer-token=${GESTOPAGO_TX_TOKEN:${GESTOPAGO_PRODUCTS_TOKEN:}}
# Codigos de respuesta del proveedor: exito y rechazo DEFINITIVO (no procesado). Cualquier otro codigo
# se trata como resultado incierto y va a conciliacion. Ajustar con la tabla de codigos oficial.
gestopago.tx.codigos-aprobada=${GESTOPAGO_CODIGOS_APROBADA:0,00}
gestopago.tx.codigos-rechazo=${GESTOPAGO_CODIGOS_RECHAZO:}
# Timeouts del cliente "gestoPagoTransacciones". Sin reintentos automaticos (ver GestoPagoTransaccionesFeignConfig)
spring.cloud.openfeign.client.config.gestoPagoTransacciones.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoTransacciones.read-timeout=20000

# Pagos de servicios - reglas de negocio
pagos.monto-minimo=1.00
pagos.monto-maximo=10000.00
pagos.limite-diario=20000.00
pagos.ventana-duplicados-segundos=120
pagos.catalogo.ttl-minutos=30
pagos.conciliacion.habilitada=true
pagos.conciliacion.intervalo-ms=60000
pagos.conciliacion.pendiente-minutos=5
pagos.conciliacion.max-intentos=10
pagos.conciliacion.lote=50

# Token JWT de los clientes (HS256). El secreto (min. 32 caracteres) NO se versiona: variable APP_JWT_SECRET
app.seguridad.jwt.secreto=${APP_JWT_SECRET:}
app.seguridad.jwt.emisor=hasani-pagos

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG

# Informacion general del API y Puertos adaptables para Railway
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=${PORT:8081}

# URLs base del servidor dinámicas
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server

# Soporte de cabeceras seguras para HTTPS en Railway (Evita NetworkError en Swagger)
server.forward-headers-strategy=framework

# Rechaza campos desconocidos en las peticiones (p. ej. id, activo, createdAt): el cliente no puede
# enviar campos controlados por el servidor
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Nunca exponer trazas ni detalles internos en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
