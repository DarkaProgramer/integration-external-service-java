# H2 in-memory para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deshabilitar Flyway en pruebas
spring.flyway.enabled=false

# Deshabilitar Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# GestoPago stub (no se usa en pruebas unitarias/repositorio)
gestopago.auth.url=http://localhost
gestopago.auth.id-distribuidor=0
gestopago.auth.codigo-dispositivo=TEST
gestopago.auth.password=test
gestopago.auth.refresh-rate-ms=3600000
gestopago.products.url=http://localhost
gestopago.products.bearer-token=test-token
gestopago.products.connect-timeout-ms=1000
gestopago.products.read-timeout-ms=1000
spring.cloud.openfeign.client.config.gestoPagoProducts.connect-timeout=1000
spring.cloud.openfeign.client.config.gestoPagoProducts.read-timeout=1000
